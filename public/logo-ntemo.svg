<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 128" role="img" aria-label="NTÊMO">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#7ee3ff"/>
      <stop offset="0.45" stop-color="#34c4eb"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee3ff"/>
      <stop offset="0.5" stop-color="#34c4eb"/>
      <stop offset="1" stop-color="#2f74e6"/>
    </linearGradient>
    <!-- Gap cut by the diagonal through both stems -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="-50" y="-50" width="200" height="200">
      <rect x="-50" y="-50" width="200" height="200" fill="#fff"/>
      <line x1="-6" y1="-32" x2="60" y2="105" stroke="#000" stroke-width="23"/>
    </mask>
  </defs>

  <!-- Monogram N -->
  <g transform="translate(47 2)">
    <g mask="url(#cut)" fill="url(#g)">
      <path d="M0 17 V64.5 a8.5 8.5 0 0 0 17 0 V8 Z"/>
      <path d="M39 10 a8.5 8.5 0 0 1 17 0 V72 H39 Z"/>
    </g>
    <line x1="13.5" y1="9" x2="40" y2="64" stroke="url(#g)" stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- Wordmark NTÊMO -->
  <g transform="translate(4 92)" fill="url(#gw)">
    <!-- N -->
    <path d="M0 0 H7 L18 16 V3 H25 V34 L7 9.5 V28 H0 Z"/>
    <!-- T -->
    <path d="M28 0 H50 V7 H42.5 V28 H35.5 V7 H28 Z"/>
    <!-- Ê -->
