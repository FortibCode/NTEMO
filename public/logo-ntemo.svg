    <path d="M54.5 -3.5 L62.5 -11 L70.5 -3.5 H65.5 L62.5 -6.3 L59.5 -3.5 Z"/>
    <!-- M -->
    <path d="M74 28 L83 0 H90 L95 14 L100 0 H107 L116 28 H108.5 L103.5 11 L98 28 H92 L86.5 11 L81.5 28 Z"/>
    <!-- O -->
    <path fill-rule="evenodd" d="M128 0 a14 14 0 1 1 0 28 a14 14 0 1 1 0 -28 Z M128 7.5 a6.5 6.5 0 1 0 0 13 a6.5 6.5 0 1 0 0 -13 Z"/>
  </g>
</svg>
